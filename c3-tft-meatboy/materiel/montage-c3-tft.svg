<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3f8"/><stop offset="1" stop-color="#dfe7f0"/></linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#243b6b"/><stop offset="1" stop-color="#16264a"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/></filter>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="url(#bg)"/>
  <text x="500" y="34" text-anchor="middle" font-size="23" font-weight="800" fill="#12233a">Cablage ESP32-C3 SuperMini + ecran ST7789 320x240 (SPI)</text>
  <text x="500" y="55" text-anchor="middle" font-size="13" fill="#5a6b82">Retroeclairage (BLK) relie au 3V3 - boutons avec pull-up interne</text>

  <!-- ============ BOARD ============ -->
  <g filter="url(#sh)">
    <rect x="360" y="120" width="150" height="360" rx="12" fill="url(#pcb)" stroke="#0c1830" stroke-width="2"/>
    <rect x="405" y="480" width="60" height="20" rx="5" fill="#c9ccd1" stroke="#8a8d92"/>
    <text x="435" y="494" text-anchor="middle" font-size="9" fill="#333">USB-C</text>
    <text x="435" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">ESP32-C3</text>
    <text x="435" y="318" text-anchor="middle" font-size="10" fill="#9aa0a6">SuperMini</text>

    <!-- LEFT pins (carte inversee : USB-C en bas) : GPIO0,1,2,3,4,3V3,GND,5V -->
    <g font-size="11.5" text-anchor="start" font-weight="600">
      <circle cx="360" cy="150" r="6" fill="#5b6875" stroke="#000"/><text x="372" y="154" fill="#aeb8c4">GPIO0</text>
      <circle cx="360" cy="190" r="7" fill="#6ee36e" stroke="#000"/><text x="372" y="194" fill="#1c5a1c">GPIO1</text>
      <circle cx="360" cy="230" r="7" fill="#ffd23c" stroke="#000"/><text x="372" y="234" fill="#7a6200">GPIO2</text>
      <circle cx="360" cy="270" r="7" fill="#ff9500" stroke="#000"/><text x="372" y="274" fill="#ffd9a3">GPIO3</text>
      <circle cx="360" cy="310" r="7" fill="#19c3d6" stroke="#000"/><text x="372" y="314" fill="#bff1f7">GPIO4</text>
      <circle cx="360" cy="350" r="7" fill="#e33" stroke="#000"/><text x="372" y="354" fill="#ffc2c2">3V3</text>
      <circle cx="360" cy="390" r="7" fill="#1b1b1b" stroke="#fff"/><text x="372" y="394" fill="#fff">GND</text>
      <circle cx="360" cy="430" r="6" fill="#9aa3ad" stroke="#000"/><text x="372" y="434" fill="#cfd8e3">5V</text>
    </g>
    <!-- RIGHT pins (inverse) : GPIO21,20,10,9,8,7,6,5 -->
    <g font-size="11.5" text-anchor="end" font-weight="600">
      <circle cx="510" cy="150" r="6" fill="#5b6875" stroke="#000"/><text x="498" y="154" fill="#aeb8c4">GPIO21</text>
      <circle cx="510" cy="190" r="6" fill="#5b6875" stroke="#000"/><text x="498" y="194" fill="#aeb8c4">GPIO20</text>
      <circle cx="510" cy="230" r="7" fill="#ff5b5b" stroke="#000"/><text x="498" y="234" fill="#ffcccc">GPIO10</text>
      <circle cx="510" cy="270" r="6" fill="#5b6875" stroke="#000"/><text x="498" y="274" fill="#aeb8c4">GPIO9</text>
      <circle cx="510" cy="310" r="6" fill="#5b6875" stroke="#000"/><text x="498" y="314" fill="#aeb8c4">GPIO8</text>
      <circle cx="510" cy="350" r="7" fill="#22c55e" stroke="#000"/><text x="498" y="354" fill="#b6f0cb">GPIO7</text>
      <circle cx="510" cy="390" r="7" fill="#1e90ff" stroke="#000"/><text x="498" y="394" fill="#bcdcff">GPIO6</text>
      <circle cx="510" cy="430" r="7" fill="#b06cff" stroke="#000"/><text x="498" y="434" fill="#e0c6ff">GPIO5</text>
    </g>
  </g>

  <!-- ============ ECRAN ST7789 ============ -->
  <g filter="url(#sh)">
    <rect x="690" y="120" width="270" height="200" rx="12" fill="#10131b" stroke="#000" stroke-width="2"/>
    <rect x="726" y="150" width="200" height="140" rx="4" fill="#1b2740"/>
    <text x="826" y="205" text-anchor="middle" font-size="15" fill="#7fd7ff">IPS 320x240</text>
    <text x="826" y="225" text-anchor="middle" font-size="11" fill="#5a8fb0">ST7789 SPI</text>
    <!-- header a gauche : GND,VCC,SCL,SDA,RES,DC,CS,BLK -->
    <g font-size="11" text-anchor="start">
      <circle cx="690" cy="140" r="6" fill="#1b1b1b" stroke="#fff"/><text x="676" y="144" text-anchor="end" fill="#333">GND</text>
      <circle cx="690" cy="162" r="6" fill="#e33" stroke="#000"/><text x="676" y="166" text-anchor="end" fill="#333">VCC</text>
      <circle cx="690" cy="184" r="6" fill="#19c3d6" stroke="#000"/><text x="676" y="188" text-anchor="end" fill="#333">SCL</text>
      <circle cx="690" cy="206" r="6" fill="#1e90ff" stroke="#000"/><text x="676" y="210" text-anchor="end" fill="#333">SDA</text>
      <circle cx="690" cy="228" r="6" fill="#ff5b5b" stroke="#000"/><text x="676" y="232" text-anchor="end" fill="#333">RES</text>
      <circle cx="690" cy="250" r="6" fill="#b06cff" stroke="#000"/><text x="676" y="254" text-anchor="end" fill="#333">DC</text>
      <circle cx="690" cy="272" r="6" fill="#22c55e" stroke="#000"/><text x="676" y="276" text-anchor="end" fill="#333">CS</text>
      <circle cx="690" cy="294" r="6" fill="#e33" stroke="#000"/><text x="676" y="298" text-anchor="end" fill="#333">BLK</text>
    </g>
  </g>

  <!-- ============ BOUTONS ============ -->
  <g filter="url(#sh)">
    <rect x="70" y="470" width="120" height="64" rx="10" fill="#fff" stroke="#c3ccd6"/>
    <circle cx="98" cy="502" r="6" fill="#ffd23c" stroke="#000"/><circle cx="162" cy="502" r="6" fill="#1b1b1b" stroke="#fff"/>
    <rect x="118" y="489" width="26" height="26" rx="6" fill="#ffe37a" stroke="#b59300"/>
    <text x="200" y="506" font-size="13" font-weight="800" fill="#8a6d00">GAUCHE (P2)</text>

    <rect x="70" y="546" width="120" height="64" rx="10" fill="#fff" stroke="#c3ccd6"/>
    <circle cx="98" cy="578" r="6" fill="#6ee36e" stroke="#000"/><circle cx="162" cy="578" r="6" fill="#1b1b1b" stroke="#fff"/>
    <rect x="118" y="565" width="26" height="26" rx="6" fill="#a9f0a9" stroke="#2c8f2c"/>
    <text x="200" y="582" font-size="13" font-weight="800" fill="#1c5a1c">DROITE (P1)</text>

    <rect x="430" y="546" width="120" height="64" rx="10" fill="#fff" stroke="#c3ccd6"/>
    <circle cx="458" cy="578" r="6" fill="#ff9500" stroke="#000"/><circle cx="522" cy="578" r="6" fill="#1b1b1b" stroke="#fff"/>
    <rect x="478" y="565" width="26" height="26" rx="6" fill="#ffc266" stroke="#b35c00"/>
    <text x="560" y="582" font-size="13" font-weight="800" fill="#b35c00">SAUT (P3)</text>
  </g>

  <!-- ============ FILS ============ -->
  <g fill="none" stroke-width="3.2" stroke-linecap="round">
    <!-- cote droit -> ecran -->
    <path d="M510 430 H600 V250 H690" stroke="#b06cff"/>            <!-- GPIO5 -> DC -->
    <path d="M510 390 H620 V206 H690" stroke="#1e90ff"/>            <!-- GPIO6 -> SDA -->
    <path d="M510 350 H640 V272 H690" stroke="#22c55e"/>            <!-- GPIO7 -> CS -->
    <path d="M510 230 H660 V228 H690" stroke="#ff5b5b"/>            <!-- GPIO10 -> RES -->
    <!-- SCLK (GPIO4, gauche) : contourne par le haut -->
    <path d="M360 310 H330 V96 H610 V184 H690" stroke="#19c3d6"/>   <!-- GPIO4 -> SCL -->
    <!-- alim ecran : 3V3 -> VCC + BLK ; GND -> GND -->
    <path d="M360 350 H320 V86 H628 V162 H690" stroke="#e33"/>      <!-- 3V3 -> VCC -->
    <path d="M320 350 V640 H648 V294 H690" stroke="#e33"/>          <!-- 3V3 -> BLK -->
    <path d="M360 390 H310 V630 H636 V140 H690" stroke="#1b1b1b"/>  <!-- GND -> GND ecran -->
    <circle cx="320" cy="350" r="4" fill="#e33"/>
    <!-- boutons vers GPIO -->
    <path d="M360 230 H98 V502" stroke="#ffd23c"/>                  <!-- GPIO2 -> GAUCHE -->
    <path d="M360 190 H240 V578 H98" stroke="#6ee36e"/>             <!-- GPIO1 -> DROITE -->
    <path d="M360 270 H458 V578" stroke="#ff9500"/>                 <!-- GPIO3 -> SAUT -->
    <!-- GND commun boutons -->
    <path d="M310 502 H162" stroke="#1b1b1b"/>
    <path d="M310 502 V578 H162" stroke="#1b1b1b"/>
    <path d="M310 578 H522" stroke="#1b1b1b"/>
    <circle cx="310" cy="502" r="4" fill="#1b1b1b"/>
    <circle cx="310" cy="578" r="4" fill="#1b1b1b"/>
  </g>

  <!-- ============ LEGENDE ============ -->
  <g font-size="12.5">
    <rect x="620" y="360" width="360" height="250" rx="10" fill="#fff" stroke="#c3ccd6" filter="url(#sh)"/>
    <text x="636" y="383" font-size="14" font-weight="800" fill="#12233a">Connexions</text>
    <g font-weight="600">
      <line x1="636" y1="400" x2="664" y2="400" stroke="#19c3d6" stroke-width="4"/><text x="672" y="404" fill="#333">GPIO4 &#8594; SCL (SCLK)</text>
      <line x1="636" y1="420" x2="664" y2="420" stroke="#1e90ff" stroke-width="4"/><text x="672" y="424" fill="#333">GPIO6 &#8594; SDA (MOSI)</text>
      <line x1="636" y1="440" x2="664" y2="440" stroke="#22c55e" stroke-width="4"/><text x="672" y="444" fill="#333">GPIO7 &#8594; CS</text>
      <line x1="636" y1="460" x2="664" y2="460" stroke="#b06cff" stroke-width="4"/><text x="672" y="464" fill="#333">GPIO5 &#8594; DC</text>
      <line x1="636" y1="480" x2="664" y2="480" stroke="#ff5b5b" stroke-width="4"/><text x="672" y="484" fill="#333">GPIO10 &#8594; RES (reset)</text>
      <line x1="636" y1="500" x2="664" y2="500" stroke="#e33" stroke-width="4"/><text x="672" y="504" fill="#333">3V3 &#8594; VCC et BLK (retroecl.)</text>
      <line x1="636" y1="520" x2="664" y2="520" stroke="#1b1b1b" stroke-width="4"/><text x="672" y="524" fill="#333">GND &#8594; GND (ecran + boutons)</text>
      <line x1="636" y1="540" x2="664" y2="540" stroke="#ffd23c" stroke-width="4"/><text x="672" y="544" fill="#333">GPIO2 &#8594; bouton GAUCHE &#8596; GND</text>
      <line x1="636" y1="560" x2="664" y2="560" stroke="#6ee36e" stroke-width="4"/><text x="672" y="564" fill="#333">GPIO1 &#8594; bouton DROITE &#8596; GND</text>
      <line x1="636" y1="580" x2="664" y2="580" stroke="#ff9500" stroke-width="4"/><text x="672" y="584" fill="#333">GPIO3 &#8594; bouton SAUT &#8596; GND</text>
    </g>
    <text x="636" y="602" font-size="11" fill="#888">SPI a 40 MHz - MISO non utilise (ecran en ecriture)</text>
  </g>
</svg>
